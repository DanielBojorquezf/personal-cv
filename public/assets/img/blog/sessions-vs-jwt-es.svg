<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Sesiones vs JWT</title>
  <desc id="desc">Una cookie de sesi&#243;n consulta el estado del usuario en Redis. Un JWT se verifica con una llave y se basta solo.</desc>
  <rect width="1600" height="900" fill="#f5f8fd"/>
  <line x1="800" y1="80" x2="800" y2="820" stroke="#d6e0ee" stroke-width="3"/>

  <text x="400" y="120" text-anchor="middle" font-family="Raleway, Arial, sans-serif" font-size="36" font-weight="700" fill="#173b6c">Sesi&#243;n</text>
  <rect x="120" y="280" width="240" height="150" rx="12" fill="#fff" stroke="#d6e0ee"/>
  <text x="240" y="340" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#122f57">Navegador</text>
  <text x="240" y="378" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="18" fill="#1f5297">cookie: sid</text>
  <path d="M370 355 H470" stroke="#149ddd" stroke-width="6"/>
  <polygon points="470,345 500,355 470,365" fill="#149ddd"/>
  <text x="430" y="335" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="16" fill="#149ddd">consulta</text>
  <rect x="510" y="280" width="260" height="150" rx="12" fill="#fff" stroke="#d6e0ee"/>
  <text x="640" y="340" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#122f57">Store Redis</text>
  <text x="640" y="378" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="18" fill="#1f5297">usuario 42</text>
  <text x="400" y="548" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="20" fill="#173b6c">El servidor recuerda.</text>
  <text x="400" y="578" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="20" fill="#173b6c">Revocas borrando la fila.</text>

  <text x="1200" y="120" text-anchor="middle" font-family="Raleway, Arial, sans-serif" font-size="36" font-weight="700" fill="#173b6c">JWT</text>
  <rect x="900" y="250" width="260" height="210" rx="12" fill="#fff" stroke="#d6e0ee"/>
  <text x="1030" y="300" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#122f57">header</text>
  <text x="1030" y="345" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#122f57">payload</text>
  <text x="1030" y="390" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#122f57">signature</text>
  <path d="M1170 355 H1260" stroke="#149ddd" stroke-width="6"/>
  <polygon points="1260,345 1290,355 1260,365" fill="#149ddd"/>
  <text x="1220" y="335" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="16" fill="#149ddd">verificar</text>
  <rect x="1300" y="280" width="200" height="150" rx="12" fill="#173b6c"/>
  <text x="1400" y="355" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#fff">llave</text>
  <text x="1400" y="382" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#fff">de firma</text>
  <text x="1200" y="548" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="20" fill="#173b6c">El token se basta solo</text>
  <text x="1200" y="578" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="20" fill="#173b6c">hasta que expira.</text>
</svg>
