<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Flujo authorization code de OAuth 2.0</title>
  <desc id="desc">Usuario, app cliente, servidor de autorizaci&#243;n y API: login, consentimiento, c&#243;digo, cambio de token y llamada con access token.</desc>
  <rect width="1600" height="900" fill="#173b6c"/>
  <text x="800" y="90" text-anchor="middle" font-family="Raleway, Arial, sans-serif" font-size="32" font-weight="700" fill="#f5f8fd">OAuth 2.0 authorization code</text>

  <rect x="70" y="280" width="230" height="110" rx="12" fill="#f5f8fd"/>
  <text x="185" y="345" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="24" font-weight="700" fill="#122f57">Usuario</text>
  <rect x="380" y="280" width="230" height="110" rx="12" fill="#f5f8fd"/>
  <text x="495" y="345" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="24" font-weight="700" fill="#122f57">App cliente</text>
  <rect x="690" y="280" width="280" height="110" rx="12" fill="#149ddd"/>
  <text x="830" y="345" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#fff">Auth server</text>
  <rect x="1060" y="280" width="250" height="110" rx="12" fill="#f5f8fd"/>
  <text x="1185" y="345" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#122f57">API de recursos</text>

  <path d="M300 335 H380" stroke="#8fd3f4" stroke-width="5"/>
  <path d="M610 335 H690" stroke="#8fd3f4" stroke-width="5"/>
  <path d="M970 335 H1060" stroke="#8fd3f4" stroke-width="5"/>

  <text x="185" y="230" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="18" fill="#8fd3f4">1. Login</text>
  <text x="495" y="230" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="18" fill="#8fd3f4">2. Consentimiento</text>
  <text x="830" y="230" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="18" fill="#8fd3f4">3. C&#243;digo</text>
  <text x="830" y="460" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="18" fill="#8fd3f4">4. Cambio de token</text>
  <text x="1185" y="460" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="18" fill="#8fd3f4">5. Access token</text>
  <text x="800" y="620" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="22" fill="#f5f8fd">PKCE en el redirect. Intercambia el code en un servidor que controlas.</text>
</svg>
