<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">WebSockets vs Webhooks</title>
  <desc id="desc">A persistent two-way WebSocket between browser and server, versus a one-way HTTP POST webhook from Service A to Service B.</desc>
  <rect width="1600" height="900" fill="#f5f8fd"/>
  <text x="800" y="86" text-anchor="middle" font-family="Raleway, Arial, sans-serif" font-size="36" font-weight="700" fill="#173b6c">Push models</text>

  <rect x="70" y="150" width="700" height="620" rx="18" fill="#fff" stroke="#d6e0ee"/>
  <text x="420" y="210" text-anchor="middle" font-family="Raleway, Arial, sans-serif" font-size="32" font-weight="700" fill="#173b6c">WebSockets</text>
  <rect x="130" y="340" width="220" height="160" rx="12" fill="#e4edf9"/>
  <text x="240" y="430" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="24" font-weight="700" fill="#122f57">Browser</text>
  <rect x="490" y="340" width="220" height="160" rx="12" fill="#e4edf9"/>
  <text x="600" y="430" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="24" font-weight="700" fill="#122f57">Server</text>
  <path d="M360 400 H480" stroke="#149ddd" stroke-width="8"/>
  <polygon points="480,390 510,400 480,410" fill="#149ddd"/>
  <polygon points="360,390 330,400 360,410" fill="#149ddd"/>
  <text x="420" y="320" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="20" fill="#149ddd">Full-duplex</text>
  <text x="420" y="560" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="20" fill="#1f5297">Persistent connection</text>

  <rect x="830" y="150" width="700" height="620" rx="18" fill="#fff" stroke="#d6e0ee"/>
  <text x="1180" y="210" text-anchor="middle" font-family="Raleway, Arial, sans-serif" font-size="32" font-weight="700" fill="#173b6c">Webhooks</text>
  <rect x="890" y="340" width="220" height="160" rx="12" fill="#e4edf9"/>
  <text x="1000" y="430" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="24" font-weight="700" fill="#122f57">Service A</text>
  <rect x="1250" y="340" width="220" height="160" rx="12" fill="#e4edf9"/>
  <text x="1360" y="430" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="24" font-weight="700" fill="#122f57">Service B</text>
  <path d="M1120 400 H1240" stroke="#149ddd" stroke-width="8"/>
  <polygon points="1240,390 1270,400 1240,410" fill="#149ddd"/>
  <text x="1180" y="320" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="20" fill="#149ddd">HTTP POST</text>
  <text x="1180" y="560" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="20" fill="#1f5297">Event callback</text>
</svg>
