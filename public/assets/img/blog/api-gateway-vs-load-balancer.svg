<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">API gateway vs load balancer</title>
  <desc id="desc">A load balancer spreads traffic to healthy app instances. An API gateway adds auth, rate limits, and routing before Lambda or an HTTP API.</desc>
  <rect width="1600" height="900" fill="#f5f8fd"/>
  <line x1="800" y1="70" x2="800" y2="830" stroke="#d6e0ee" stroke-width="3"/>

  <text x="400" y="110" text-anchor="middle" font-family="Raleway, Arial, sans-serif" font-size="32" font-weight="700" fill="#173b6c">Load balancer</text>
  <text x="400" y="180" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="18" fill="#1f5297">Users</text>
  <rect x="240" y="220" width="320" height="80" rx="8" fill="#173b6c"/>
  <text x="400" y="270" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="24" fill="#fff">ALB</text>
  <rect x="90" y="500" width="180" height="80" rx="8" fill="#fff" stroke="#d6e0ee"/>
  <text x="180" y="548" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="18" fill="#122f57">App instance</text>
  <rect x="310" y="500" width="180" height="80" rx="8" fill="#fff" stroke="#d6e0ee"/>
  <text x="400" y="548" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="18" fill="#122f57">App instance</text>
  <rect x="530" y="500" width="180" height="80" rx="8" fill="#fff" stroke="#d6e0ee"/>
  <text x="620" y="548" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="18" fill="#122f57">App instance</text>
  <path d="M400 300 V430 M400 430 L180 500 M400 430 L400 500 M400 430 L620 500" stroke="#149ddd" stroke-width="3" fill="none"/>
  <text x="400" y="680" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="18" fill="#173b6c">Spread traffic to healthy targets</text>

  <text x="1200" y="110" text-anchor="middle" font-family="Raleway, Arial, sans-serif" font-size="32" font-weight="700" fill="#173b6c">API gateway</text>
  <text x="1200" y="180" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="18" fill="#1f5297">Users</text>
  <rect x="1040" y="220" width="320" height="80" rx="8" fill="#173b6c"/>
  <text x="1200" y="270" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="24" fill="#fff">API Gateway</text>
  <rect x="1000" y="330" width="90" height="36" rx="6" fill="#149ddd"/>
  <text x="1045" y="354" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="14" fill="#fff">Auth</text>
  <rect x="1105" y="330" width="110" height="36" rx="6" fill="#149ddd"/>
  <text x="1160" y="354" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="14" fill="#fff">Rate limit</text>
  <rect x="1230" y="330" width="100" height="36" rx="6" fill="#149ddd"/>
  <text x="1280" y="354" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="14" fill="#fff">Routes</text>
  <rect x="1010" y="500" width="180" height="80" rx="8" fill="#fff" stroke="#d6e0ee"/>
  <text x="1100" y="548" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="18" fill="#122f57">Lambda</text>
  <rect x="1210" y="500" width="180" height="80" rx="8" fill="#fff" stroke="#d6e0ee"/>
  <text x="1300" y="548" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="18" fill="#122f57">HTTP API</text>
  <path d="M1200 366 V430 M1200 430 L1100 500 M1200 430 L1300 500" stroke="#149ddd" stroke-width="3" fill="none"/>
  <text x="1200" y="680" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="18" fill="#173b6c">Enforce the API contract</text>
</svg>
